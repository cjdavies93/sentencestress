<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stress the Word</title>
<style>
  :root {
    --bg: #c9d9f7;
    --panel: #ffffff;
    --ink: #1c2540;
    --muted: #5d6783;
    --accent: #2c55e0;
    --accent-dark: #1b3bb0;
    --line: #c3cbdb;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 28px 28px;
  }
  h1 { margin: 0 0 20px; font-size: 1.6rem; letter-spacing: -0.01em; }
  .nav {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .nav #nextBtn { justify-self: end; }
  .nav .count { font-weight: 600; font-size: 0.9rem; color: var(--muted); text-align: center; }
  .card {
    background: var(--tint, #f9c6d9);
    border-radius: 8px;
    padding: 14px 16px 16px;
    margin-bottom: 12px;
  }
  #statementCard { --tint: #fcefa0; }
  .label { font-weight: 600; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  .sentence { font-size: clamp(1.4rem, 5vw, 1.9rem); line-height: 1.4; font-weight: 600; }
  .statement { font-size: 1.2rem; line-height: 1.45; }
  .word.stressed {
    color: var(--accent-dark);
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 6px;
    text-transform: uppercase;
  }
  #hint { margin: 0 0 16px; line-height: 1.5; }
  .buttons { display: flex; gap: 12px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--btn, #bfead0);
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { filter: brightness(0.94); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #revealBtn { --btn: #dcc9f3; }
  button.secondary, button.small {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
  }
  button.secondary:hover:not(:disabled) { filter: none; border-color: var(--muted); }
  button.small { padding: 8px 12px; font-size: 0.9rem; }
  #revealBtn.secondary { background: var(--btn); border-color: transparent; }
  button:disabled { opacity: 0.4; cursor: default; }
  .hidden { display: none; }
  .error { color: var(--error); font-size: 0.9rem; line-height: 1.4; margin: 12px 0 0; }
  .error:empty { display: none; }
  @media (max-width: 420px) {
    main { padding: 24px 18px; }
    .nav { grid-template-columns: 1fr 1fr; }
    .nav .count { grid-column: 1 / -1; grid-row: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Stress the Word</h1>
  <div class="nav">
    <button class="secondary small" id="prevBtn" disabled>← Previous sentence</button>
    <span class="count" id="count"></span>
    <button class="secondary small" id="nextBtn" disabled>Next sentence →</button>
  </div>

  <div class="card">
    <div class="label">Your sentence</div>
    <div class="sentence" id="sentence">Loading…</div>
  </div>

  <div class="card hidden" id="statementCard">
    <div class="label">Someone says to you…</div>
    <div class="statement" id="statement"></div>
  </div>

  <p id="hint" class="label hidden">Say the sentence aloud as a reply, stressing the right word.</p>

  <div class="buttons">
    <button id="drawBtn" disabled>Draw a statement</button>
    <button id="revealBtn" class="secondary hidden">Reveal the stressed word</button>
  </div>
  <p class="error" id="error"></p>
</main>

<script>
  let sentences = [];
  let sIndex = 0;
  let current = -1;
  let revealed = false;

  const $ = id => document.getElementById(id);

  function renderSentence(stressIndex = null) {
    const words = sentences[sIndex].text.split(/\s+/);
    const el = $('sentence');
    el.innerHTML = '';
    words.forEach((w, i) => {
      const span = document.createElement('span');
      span.className = 'word' + (i === stressIndex ? ' stressed' : '');
      span.textContent = w;
      el.appendChild(span);
      if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
    });
  }

  function showSentence(i) {
    sIndex = i;
    current = -1;
    revealed = false;
    renderSentence();
    $('count').textContent = `Sentence ${sIndex + 1} of ${sentences.length}`;
    $('prevBtn').disabled = sentences.length < 2;
    $('nextBtn').disabled = sentences.length < 2;
    $('statementCard').classList.add('hidden');
    $('hint').classList.add('hidden');
    $('revealBtn').classList.add('hidden');
    $('drawBtn').textContent = 'Draw a statement';
    $('drawBtn').disabled = false;
  }

  function move(step) {
    showSentence((sIndex + step + sentences.length) % sentences.length);
  }

  function draw() {
    const list = sentences[sIndex].statements;
    let next;
    do { next = Math.floor(Math.random() * list.length); }
    while (list.length > 1 && next === current);
    current = next;
    revealed = false;
    $('statement').textContent = '\u201C' + list[current].text + '\u201D';
    $('statementCard').classList.remove('hidden');
    $('hint').classList.remove('hidden');
    $('revealBtn').classList.remove('hidden');
    $('revealBtn').textContent = 'Reveal the stressed word';
    $('drawBtn').textContent = 'Draw another';
    renderSentence();
  }

  function reveal() {
    revealed = !revealed;
    renderSentence(revealed ? sentences[sIndex].statements[current].stress : null);
    $('revealBtn').textContent = revealed ? 'Hide the answer' : 'Reveal the stressed word';
  }

  fetch('data.json')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(json => {
      sentences = (json.sentences || []).filter(s => s.text && s.statements && s.statements.length);
      if (!sentences.length) throw new Error('empty');
      showSentence(0);
    })
    .catch(() => {
      $('sentence').textContent = 'Could not load data.json';
      $('error').textContent = 'If you opened this file directly, serve the folder over HTTP instead (e.g. run "python3 -m http.server" in it).';
    });

  $('drawBtn').addEventListener('click', draw);
  $('revealBtn').addEventListener('click', reveal);
  $('prevBtn').addEventListener('click', () => move(-1));
  $('nextBtn').addEventListener('click', () => move(1));
</script>
</body>
</html>
